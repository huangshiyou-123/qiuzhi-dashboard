<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职作战台</title>
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --primary-hover: #4f46e5;
  --accent: #10b981;
  --border: #e2e8f0;
  --sidebar-bg: #0f172a;
  --sidebar-hover: rgba(99,102,241,.12);
  --sidebar-text: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.sidebar {
  width: 240px;
  background: var(--sidebar-bg);
  color: #fff;
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
  border-right: 1px solid rgba(255,255,255,.06);
}
.sidebar-header { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar-header h1 {
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.sidebar-header p { font-size: 12px; color: var(--sidebar-text); margin-top: 4px; letter-spacing: .5px; }
.nav-list { list-style: none; padding: 16px 0; flex: 1; }
.nav-item {
  padding: 11px 24px; cursor: pointer; display: flex; align-items: center; gap: 12px;
  font-size: 14px; font-weight: 500; color: var(--sidebar-text);
  transition: all var(--transition); border-left: 3px solid transparent; margin: 2px 0;
}
.nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
.nav-item.active {
  background: rgba(99,102,241,.15); color: #fff;
  border-left-color: #818cf8; font-weight: 600;
}
.nav-icon { font-size: 18px; width: 26px; text-align: center; opacity: .85; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.08); }
.sidebar-footer button {
  width: 100%; padding: 14px 10px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.04); color: var(--sidebar-text);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 500;
  transition: all var(--transition);
  position: relative; z-index: 5; pointer-events: auto; min-height: 52px;
}
.sidebar-footer button:hover { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.25); }

.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.top-bar {
  background: var(--card); padding: 18px 36px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.top-bar h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.top-bar-right { display: flex; align-items: center; gap: 16px; }
.api-status {
  display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500;
  padding: 8px 14px; border-radius: 24px; background: #ecfdf5; color: #065f46;
}
.api-status.off { background: #fef2f2; color: #991b1b; }
.api-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.2); }
.api-dot.off { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.2); }
.content { padding: 28px 36px; flex: 1; overflow-y: auto; }

.bottom-bar {
  background: var(--card); padding: 14px 36px; border-top: 1px solid var(--border);
  display: flex; gap: 36px; font-size: 13px; font-weight: 500; color: var(--muted);
}
.bottom-bar strong { color: var(--text); font-size: 16px; font-weight: 700; }

.view { display: none; }
.view.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card); border-radius: var(--radius); padding: 28px;
  box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border);
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }
.card h3 { font-size: 16px; font-weight: 700; margin-bottom: 18px; color: var(--text); letter-spacing: -.2px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 22px 24px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  position: relative; overflow: hidden; transition: all var(--transition);
}
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; }
.stat-card:nth-child(2)::before { background: var(--info); }
.stat-card:nth-child(3)::before { background: var(--accent); }
.stat-card:nth-child(4)::before { background: var(--warning); }
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.stat-card .label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
.stat-card .value { font-size: 32px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
.stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }

textarea, input[type="text"], input[type="password"], select {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; resize: vertical;
  transition: border-color var(--transition), box-shadow var(--transition); background: #fafbfc; color: var(--text);
}
select { transition: none; cursor: pointer; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); background: #fff; }
textarea { min-height: 160px; line-height: 1.6; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-group { margin-bottom: 18px; }

.btn {
  padding: 10px 22px; border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
  transition: all var(--transition); letter-spacing: -.1px;
}
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(99,102,241,.3); }
.btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(99,102,241,.35); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn-outline.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-accent { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(16,185,129,.3); }
.btn-accent:hover { opacity: .9; transform: translateY(-1px); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-group { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }

.result-box {
  background: #fafbfc; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; min-height: 60px; white-space: pre-wrap;
  font-size: 14px; line-height: 1.7; margin-top: 10px;
}
.result-box.loading { color: var(--muted); font-style: italic; }
.result-box .match-score { font-size: 42px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.result-box h4 { font-size: 14px; margin: 14px 0 8px; color: var(--text); font-weight: 700; }
.pitch-variant { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.pitch-variant:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.pitch-variant h4 { color: var(--primary); font-size: 14px; font-weight: 700; }
.copy-btn { float: right; font-size: 12px; }

.kanban { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 20px; min-height: 420px; align-items: flex-start; }
.kanban-col { flex: 1; min-width: 185px; background: #f1f5f9; border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
.kanban-col h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.kanban-col h4 span { background: var(--card); border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--muted); box-shadow: var(--shadow-sm); }
.kanban-cards { min-height: 60px; }
.kanban-card {
  background: var(--card); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px;
  box-shadow: var(--shadow-sm); cursor: grab; font-size: 13px;
  border-left: 3px solid var(--primary); transition: all var(--transition);
}
.kanban-card:hover { box-shadow: var(--shadow); }
.kanban-card:active { cursor: grabbing; }
.kanban-card.dragging { opacity: .4; transform: rotate(2deg); }
.kanban-card .kc-company { font-weight: 700; margin-bottom: 3px; font-size: 14px; }
.kanban-card .kc-position { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.kanban-card .kc-date { color: var(--muted); font-size: 11px; }
.kanban-col.drag-over { background: var(--primary-light); border-color: var(--primary); }
.kanban-card .kc-actions { margin-top: 10px; display: flex; gap: 6px; }

.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,23,42,.5); backdrop-filter: blur(4px); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 14px; padding: 36px; max-width: 720px;
  width: 92%; max-height: 82vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  animation: modalIn .25s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h3 { margin-bottom: 22px; font-size: 20px; font-weight: 700; }
.modal-close { float: right; background: none; border: none; font-size: 26px; cursor: pointer; color: var(--muted); transition: color var(--transition); }
.modal-close:hover { color: var(--text); }

.settings-section { margin-bottom: 26px; }
.settings-section h4 { margin-bottom: 10px; font-size: 15px; font-weight: 700; }

.empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-state .icon { font-size: 52px; margin-bottom: 14px; }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 22px; }
.tab { padding: 11px 22px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all var(--transition); }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn .2s ease; }

.toast {
  position: fixed; top: 24px; right: 24px; background: #0f172a; color: #fff;
  padding: 14px 22px; border-radius: 10px; font-size: 13px; font-weight: 500;
  z-index: 200; animation: slideIn .3s ease; display: none; box-shadow: var(--shadow-lg);
}
.toast.show { display: block; }
.toast.success { background: #065f46; }
.toast.error { background: #991b1b; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.status-badge.applied { background: #dbeafe; color: #1e40af; }
.status-badge.viewed { background: #fef3c7; color: #92400e; }
.status-badge.replied { background: #d1fae5; color: #065f46; }
.status-badge.interview { background: #ede9fe; color: #5b21b6; }
.status-badge.offer { background: #d1fae5; color: #065f46; }
.status-badge.rejected { background: #fee2e2; color: #991b1b; }
.status-badge.saved { background: #f3f4f6; color: #374151; }

.resume-section { margin-bottom: 18px; }
.resume-section textarea { min-height: 200px; }

</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-header">
    <h1>⚔️ 求职作战台</h1>
    <p>JD解析 · 话术 · 简历 · 追踪</p>
  </div>
  <ul class="nav-list">
    <li class="nav-item active" data-view="dashboard">
      <span class="nav-icon">📊</span> 仪表盘
    </li>
    <li class="nav-item" data-view="new-job">
      <span class="nav-icon">➕</span> 新增岗位
    </li>
    <li class="nav-item" data-view="kanban">
      <span class="nav-icon">📋</span> 状态看板
    </li>
    <li class="nav-item" data-view="offer-compare">
      <span class="nav-icon">⚖️</span> Offer对比
    </li>
    <li class="nav-item" data-view="analytics">
      <span class="nav-icon">📈</span> 数据面板
    </li>
  </ul>
  <div class="sidebar-footer">
    <button onclick="openSettings()">⚙️ API设置</button>
  </div>
</nav>

<!-- Main -->
<div class="main">
  <div class="top-bar">
    <h2 id="viewTitle">仪表盘</h2>
    <div class="top-bar-right">
      <span class="api-status" id="apiStatus">
        <span class="api-dot" id="apiDot"></span>
        <span id="apiStatusText">API 已就绪 (免费Key)</span>
      </span>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
  <div class="bottom-bar" id="bottomBar">
    <div>总计：<strong id="statTotal">0</strong> 家</div>
    <div>已读率：<strong id="statViewRate">—</strong></div>
    <div>回复率：<strong id="statReplyRate">—</strong></div>
    <div>面试：<strong id="statInterview">0</strong> 次</div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <button class="modal-close" onclick="closeSettings()">&times;</button>
    <h3>⚙️ API 设置</h3>
    <div class="settings-section">
      <label>DeepSeek API Key <span style="color:#10b981;font-size:11px">（已内置免费Key，也可填自己的）</span></label>
      <input type="password" id="apiKeyInput" placeholder="留空则使用内置免费Key" style="margin-bottom:8px">
      <p style="font-size:12px;color:var(--muted)">Key 仅存储在浏览器本地，不上传任何服务器。</p>
    </div>
    <div class="settings-section">
      <label>🔮 截图识别模型（可选）</label>
      <select id="visionModelSelect" style="margin-bottom:4px">
        <option value="">不使用截图识别</option>
        <option value="qwen">通义千问 Qwen-VL-Max（推荐，中文OCR准确）</option>
      </select>
      <input type="password" id="qwenApiKeyInput" placeholder="千问 API Key (sk-...)" style="margin-top:8px">
      <p style="font-size:12px;color:var(--muted)">使用通义千问多模态模型识别JD截图，比本地OCR更准确。不配置则继续用浏览器本地OCR。</p>
    </div>
    <div class="settings-section">
      <h4>📄 我的通用简历</h4>
      <textarea id="resumeTemplate" placeholder="粘贴你的通用简历文本，后续话术生成和简历优化会自动使用..." style="min-height:200px"></textarea>
      <p style="font-size:12px;color:var(--muted)">保存后，每次生成话术和优化简历时自动填充。</p>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ Database ============
const db = new Dexie('QiuzhiDashboard');
db.version(1).stores({
  applications: '++id, company, position, status, channel, dateCreated, dateApplied',
  settings: 'key'
});

// ============ State ============
let currentView = 'dashboard';
let currentTab = 'parse';

const VIEW_TITLES = {
  dashboard: '仪表盘',
  'new-job': '新增岗位',
  kanban: '状态看板',
  analytics: '数据面板',
  'offer-compare': 'Offer对比器'
};
const STATUSES = ['saved', 'applied', 'viewed', 'replied', 'interview', 'offer', 'rejected'];
const STATUS_LABELS = {
  saved: '📥 待投', applied: '📤 已投', viewed: '👁️ 已读',
  replied: '💬 已回', interview: '🎙️ 面试', offer: '🎉 Offer', rejected: '❌ 挂断'
};
const CHANNELS = ['BOSS直聘', '拉勾', '猎聘', '脉脉', '官网', '内推', '其他'];

// ============ Init ============
document.addEventListener('DOMContentLoaded', () => {
  loadSettings();
  initNav();
  renderView('dashboard');
});

function loadSettings() {
  db.settings.get('apiKey').then(s => { if (s && s.value) { document.getElementById('apiKeyInput').value = s.value; updateApiStatus(true); } else { updateApiStatus(false); } });
  db.settings.get('resume').then(s => { if (s) document.getElementById('resumeTemplate').value = s.value; });
  db.settings.get('qwenApiKey').then(s => { if (s) document.getElementById('qwenApiKeyInput').value = s.value; });
  db.settings.get('visionModel').then(s => { if (s) document.getElementById('visionModelSelect').value = s.value; });
}

function updateApiStatus(hasUserKey) {
  const el = document.getElementById('apiStatus');
  const dot = document.getElementById('apiDot');
  const txt = document.getElementById('apiStatusText');
  if (hasUserKey) { el.className = 'api-status'; dot.className = 'api-dot'; txt.textContent = 'API 已就绪 (自配)'; }
  else { el.className = 'api-status'; dot.className = 'api-dot'; txt.textContent = 'API 已就绪 (免费Key)'; }
}

// ============ Navigation ============
function initNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const v = item.dataset.view;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      renderView(v);
    });
  });
}

function renderView(view) {
  if (window._lastRenderedView === view) return; // 同一页面不重复渲染，保护进行中的操作
  window._lastRenderedView = view;
  currentView = view;
  document.getElementById('viewTitle').textContent = VIEW_TITLES[view];
  const content = document.getElementById('mainContent');
  switch(view) {
    case 'dashboard': renderDashboard(content); break;
    case 'new-job': renderNewJob(content); break;
    case 'kanban': renderKanban(content); break;
    case 'analytics': renderAnalytics(content); break;
    case 'offer-compare': renderOfferCompare(content); break;
  }
  updateBottomBar();
}

// ============ Dashboard ============
async function renderDashboard(container) {
  const apps = await db.applications.toArray();
  const stats = calcStats(apps);
  const recent = apps.slice().sort((a,b) => (b.dateCreated || '').localeCompare(a.dateCreated || '')).slice(0, 5);

  container.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">总投递</div><div class="value">${stats.total}</div></div>
      <div class="stat-card"><div class="label">已读率</div><div class="value">${stats.viewRate}%</div><div class="sub">${stats.viewed} 已读 / ${stats.applied} 已投</div></div>
      <div class="stat-card"><div class="label">回复率</div><div class="value">${stats.replyRate}%</div><div class="sub">${stats.replied} 回复</div></div>
      <div class="stat-card"><div class="label">面试邀请</div><div class="value">${stats.interview}</div></div>
      <div class="stat-card"><div class="label">本周新增</div><div class="value">${stats.thisWeek}</div></div>
    </div>
    <div class="card">
      <h3>📌 最近投递</h3>
      ${recent.length === 0 ? '<div class="empty-state"><div class="icon">📭</div><p>还没有投递记录，去"新增岗位"开始吧</p></div>' : recent.map(a => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
          <div>
            <strong>${a.company || '未知公司'}</strong> — ${a.position || '未知岗位'}
            <span class="status-badge ${a.status}">${STATUS_LABELS[a.status]}</span>
          </div>
          <div style="color:var(--muted);font-size:12px">${formatDate(a.dateCreated)} · ${a.channel || ''}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function calcStats(apps) {
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const total = apps.length;
  const applied = apps.filter(a => a.status !== 'saved').length;
  const viewed = apps.filter(a => ['viewed','replied','interview','offer','rejected'].includes(a.status)).length;
  const replied = apps.filter(a => ['replied','interview','offer'].includes(a.status)).length;
  const interview = apps.filter(a => ['interview','offer'].includes(a.status)).length;
  const thisWeek = apps.filter(a => a.dateCreated && new Date(a.dateCreated) >= weekAgo).length;
  return {
    total, applied, viewed, replied, interview, thisWeek,
    viewRate: applied > 0 ? Math.round(viewed/applied*100) : 0,
    replyRate: applied > 0 ? Math.round(replied/applied*100) : 0
  };
}

async function updateBottomBar() {
  const apps = await db.applications.toArray();
  const stats = calcStats(apps);
  document.getElementById('statTotal').textContent = stats.total;
  document.getElementById('statViewRate').textContent = stats.viewRate + '%';
  document.getElementById('statReplyRate').textContent = stats.replyRate + '%';
  document.getElementById('statInterview').textContent = stats.interview;
}

function extractField(text, fieldName) {
  const m = text.match(new RegExp('##\\s*' + fieldName + '\\s*\\n(.+)'));

function handleImageDrop(e) {

  const file = e.target.files[0];

function processImageFile(file) {

async function callQwenVL(apiKey, imageDataUrl) {
  const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'qwen-vl-max',
      messages: [{
        role: 'user',
        content: [
          { type: 'text', text: '请准确识别这张招聘JD截图中的所有文字内容。只输出识别出的完整原文，不要添加任何解释、总结或格式化。' },
          { type: 'image_url', image_url: { url: imageDataUrl } }
        ]
      }],
      max_tokens: 4096
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || err.message || 'HTTP ' + resp.status);
  }
  const data = await resp.json();
  return data.choices[0].message.content;
}

function renderResumeResult(text) {
  let html = text;
  // Highlight match score
  html = html.replace(/###\s*匹配度评分\s*\n(\d+)/, (_, score) => {
    const s = parseInt(score);
    const color = s >= 70 ? 'var(--accent)' : s >= 40 ? 'var(--warning)' : 'var(--danger)';
    return `<div class="match-score" style="color:${color}">${s}/100</div><h4>匹配度评分</h4>`;
  });
  html = html.replace(/###\s*(.+)/g, '<h4>$1</h4>');
  html = html.replace(/\n- (.+)/g, '\n• $1');
  html = html.replace(/\*\*/g, '');
  html = html.replace(/\*/g, '');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// Drag & Drop
function handleDragStart(e) {
  e.target.classList.add('dragging');
  e.dataTransfer.setData('text/plain', e.target.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
async function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = parseInt(e.dataTransfer.getData('text/plain'));
  const newStatus = e.currentTarget.dataset.status;
  await db.applications.update(id, {
    status: newStatus,
    dateUpdated: new Date().toISOString(),
    dateApplied: newStatus === 'applied' ? new Date().toISOString() : undefined
  });
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  renderView('kanban');
  updateBottomBar();
  showToast('状态已更新 → ' + STATUS_LABELS[newStatus], 'success');
}

async function renderAnalytics(container) {

  });

  // Weekly trend (last 4 weeks)
  const weeks = [];
  for (let i = 3; i >= 0; i--) {
    const end = new Date(Date.now() - i*7*24*60*60*1000);
    const start = new Date(end - 7*24*60*60*1000);
    const count = apps.filter(a => a.dateCreated && new Date(a.dateCreated) >= start && new Date(a.dateCreated) < end).length;
    weeks.push({ label: `${start.getMonth()+1}/${start.getDate()}`, count });

  setTimeout(() => {
    const ctx1 = document.getElementById('weeklyChart');

      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }

    if (ctx3) new Chart(ctx3, {

// ============ Utils ============
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function markdownToHtml(md) {
  var h = md;
  // Bold
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  // Italic
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // List items
  h = h.replace(/^[\*\-\•]\s/gm, '• ');
  // Headings
  h = h.replace(/^### (.+)$/gm, '<h4 style="margin:16px 0 8px">$1</h4>');
  h = h.replace(/^## (.+)$/gm, '<h3 style="margin:20px 0 10px;color:var(--primary)">$1</h3>');
  h = h.replace(/^# (.+)$/gm, '<h2 style="margin:24px 0 12px">$1</h2>');
  // Dash lists
  h = h.replace(/^- (.+)$/gm, '<li style="margin:4px 0;line-height:1.7">$1</li>');
  h = h.replace(/((?:<li[^>]*>.*?<\/li>\s*)+)/g, '<ul style="padding-left:20px;margin:8px 0">$1</ul>');
  // Strip ALL remaining asterisks
  h = h.replace(/\*/g, '');
  // Paragraphs
  h = h.replace(/\n\n/g, '</p><p style="margin:12px 0;line-height:1.8">');
  h = h.replace(/\n/g, '<br>');
  h = '<p style="margin:8px 0;line-height:1.8">' + h + '</p>';
  // Cleanup
  h = h.replace(/<p[^>]*><\/p>/g, '');
  h = h.replace(/<li([^>]*)><br>/g, '<li$1>');
  return h;
}
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'));
}
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Close modals on overlay click
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('show');
  }
});
</script>
